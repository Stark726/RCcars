name: watch

on:
  # Backup only: each run starts the next one itself (see the last step), because
  # GitHub's timer is often late or skipped. This restarts the chain if it breaks.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One monitor at a time; a waiting run never overlaps a running one.
concurrency:
  group: mattel-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-checkout.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-checkout.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-checkout.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set git identity for state commits
        run: |
          git config user.name "mattel-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # One-time switch when deploy/github-config.json changes collections; a no-op otherwise.
      - name: Apply collection changes
        run: python -m mattel_watch.cli rescope --config deploy/github-config.json

      # About 10 minutes of monitoring in two 5-minute rounds. Each round stops cleanly
      # (Ctrl+C) and saves state, so a crash loses at most one round.
      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          for round in 1 2; do
            echo "::group::Round $round"
            timeout --preserve-status -s INT 290 python -m mattel_watch.cli run --config deploy/github-config.json || echo "Round $round exited with $?"
            bash deploy/save_state.sh
            echo "::endgroup::"
          done

      - name: Save state
        if: always()
        run: bash deploy/save_state.sh

      # Start the next run straight away. Skipped when this run ended early (for example a
      # bad token), so a failing setup cannot loop; the backup timer retries later.
      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 480 ]; then echo "Run was short; not chaining"; exit 0; fi
          gh workflow run watch.yml --ref main